# Builds every release file. Linux and Windows: packaging/build.sh, the same Docker containers as
# locally. macOS: packaging/build-macos.sh on GitHub's Macs, the only place a Mac app can be built.
# A published release gets all the files and their SHA256SUMS attached.
name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "assets/hero.jpg"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./packaging/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*
            !dist/altalk
            !dist/SHA256SUMS

  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]  # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: ./packaging/build-macos.sh
      - name: Start the app in English and in Russian, take screenshots
        run: |
          app=build/macos/dist/Altalk.app/Contents/MacOS/altalk
          log=~/Library/Logs/Altalk/altalk.log
          mkdir -p screenshots
          for language in en ru; do
            "$app" -AppleLanguages "($language)" &
            sleep 25
            screencapture -x "screenshots/$language-${{ matrix.runner }}.png" || true
            kill $! && wait $! || true
          done
          cat "$log"
          grep -q "Tray icon registered" "$log"
      - name: Hold Left Option, then press a key while holding it
        run: |
          build/macos/dist/Altalk.app/Contents/MacOS/altalk &
          sleep 15
          build/macos/venv/bin/python packaging/macos/press-keys.py
          sleep 5
          kill $! && wait $! || true
          tail -n 12 ~/Library/Logs/Altalk/altalk.log
          grep -q "Recording started" ~/Library/Logs/Altalk/altalk.log
          grep -q "recording aborted" ~/Library/Logs/Altalk/altalk.log
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: screenshots

  release:
    if: github.event_name == 'release'
    needs: [linux-windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux-windows,macos-*}"
          merge-multiple: true
          path: dist
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release upload "${{ github.event.release.tag_name }}" * --clobber --repo "${{ github.repository }}"
